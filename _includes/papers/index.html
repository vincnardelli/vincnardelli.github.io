<section class="ui-hero">
  <span class="ui-eyebrow"><i class="fas fa-book-open"></i> {% include t.html en="Research output" it="Ricerca" %}</span>
  <h1 class="ui-title">{% include t.html en="Publications" it="Pubblicazioni" %}</h1>
</section>

<!-- Filtri -->
<div class="pub-filters">
  <div class="ui-search pub-search">
    <i class="fas fa-search"></i>
    <input type="search" id="pub-q" class="ui-input" placeholder="Search by title, author or journal…" aria-label="Search publications"
           data-en-placeholder="Search by title, author or journal…" data-it-placeholder="Cerca per titolo, autore o rivista…"
           data-en-aria-label="Search publications" data-it-aria-label="Cerca pubblicazioni">
  </div>
  <select id="pub-year" class="ui-select pub-year" aria-label="Filter by year" data-en-aria-label="Filter by year" data-it-aria-label="Filtra per anno">
    <option value="" id="pub-year-all">All years</option>
  </select>
</div>
<div class="ui-chips pub-types" id="pub-types" role="group" aria-label="Filter by type"></div>

<p class="pub-count" id="pub-count" aria-live="polite"></p>

<div class="ui-grid ui-grid-2" id="pub-list"></div>

<div class="pub-empty" id="pub-empty" hidden>
  <i class="far fa-folder-open"></i>
  <p>{% include t.html en="No publications match these filters." it="Nessuna pubblicazione corrisponde ai filtri." %}</p>
  <button type="button" class="ui-btn ui-btn-outline ui-btn-sm" id="pub-reset">{% include t.html en="Clear filters" it="Azzera i filtri" %}</button>
</div>

<script>
(function () {
  var state = { q: '', type: '', year: '' };
  var all = [];
  var list = document.getElementById('pub-list');
  var T = function (en, it) { return window.i18n.t(en, it); };
  var CAT_IT = { 'Journal Article': 'Articolo su rivista', 'Conference Paper': 'Contributo a convegno', 'Publication': 'Pubblicazione' };
  function cat(c) { c = c || 'Publication'; return T(c, CAT_IT[c] || c); }

  function esc(s) {
    return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function dateOf(p) { return p.date ? new Date(p.date) : new Date(p.year || 0, 0, 1); }
  function titleCase(s) {
    // Le riviste arrivano spesso in maiuscolo dal catalogo IRIS
    if (!s || s !== s.toUpperCase()) return s;
    return s.toLowerCase().replace(/(^|\s|-|\()([a-zà-ù])/g, function (m, a, b) { return a + b.toUpperCase(); })
      .replace(/\b(Of|And|In|On|For|The|A|An|To|Di|E|Del|Della|Per)\b/g, function (w, x, i) { return i === 0 ? w : w.toLowerCase(); });
  }

  // Al massimo 6 autori per scheda; il mio nome resta sempre visibile
  var MAX_AUTHORS = 6, ME = 'Vincenzo Nardelli';
  function shortAuthors(s) {
    var names = String(s || '').split(',').map(function (n) { return n.trim(); }).filter(Boolean);
    var shown = names, extra = 0;
    if (names.length > MAX_AUTHORS) {
      var me = names.indexOf(ME);
      shown = (me === -1 || me < MAX_AUTHORS) ? names.slice(0, MAX_AUTHORS) : names.slice(0, MAX_AUTHORS - 1).concat(['…', ME]);
      extra = names.length - MAX_AUTHORS;
    }
    return shown.map(function (n) { return n === ME ? '<strong>' + esc(n) + '</strong>' : esc(n); }).join(', ') +
      (extra ? ' <span class="pub-more">+' + extra + ' ' + T('more', 'altri') + '</span>' : '');
  }

  fetch('{{ "/assets/papers.json" | relative_url }}')
    .then(function (r) { return r.json(); })
    .then(function (papers) {
      all = papers.sort(function (a, b) { return dateOf(b) - dateOf(a); });

      buildChips();

      var years = Array.from(new Set(all.map(function (p) { return String(p.year || ''); }).filter(Boolean))).sort().reverse();
      var sel = document.getElementById('pub-year');
      years.forEach(function (y) { sel.insertAdjacentHTML('beforeend', '<option value="' + y + '">' + y + '</option>'); });

      render();
    })
    .catch(function () {
      list.innerHTML = '<p class="text-danger">' + T('Could not load publications. Please try again later.', 'Impossibile caricare le pubblicazioni. Riprova più tardi.') + '</p>';
    });

  function buildChips() {
    var types = {};
    all.forEach(function (p) { var t = p.category || 'Publication'; types[t] = (types[t] || 0) + 1; });
    var html = '<button type="button" class="ui-chip' + (state.type ? '' : ' is-active') + '" data-type="">' + T('All', 'Tutte') + ' <span class="ui-chip-count">' + all.length + '</span></button>';
    Object.keys(types).sort().forEach(function (t) {
      html += '<button type="button" class="ui-chip' + (state.type === t ? ' is-active' : '') + '" data-type="' + esc(t) + '">' + esc(cat(t)) + ' <span class="ui-chip-count">' + types[t] + '</span></button>';
    });
    document.getElementById('pub-types').innerHTML = html;
    document.getElementById('pub-year-all').textContent = T('All years', 'Tutti gli anni');
  }

  window.i18n.onChange(function () { if (all.length) { buildChips(); render(); } });

  function render() {
    var q = state.q.toLowerCase();
    var items = all.filter(function (p) {
      if (state.type && (p.category || 'Publication') !== state.type) return false;
      if (state.year && String(p.year) !== state.year) return false;
      if (q && [p.name, p.title, p.authors, p.journal].join(' ').toLowerCase().indexOf(q) === -1) return false;
      return true;
    });

    list.innerHTML = items.map(function (p) {
      var url = p.link || '{{ "/papers/" | relative_url }}' + (p.slug || p.filename || '');
      var ext = !!p.link;
      var authors = shortAuthors(p.authors);
      return '<a class="ui-card pub-card" href="' + esc(url) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' +
        '<span class="ui-badge">' + esc(cat(p.category)) + '</span>' +
        '<i class="fas ' + (ext ? 'fa-external-link-alt' : 'fa-arrow-right') + ' ui-card-arrow"></i>' +
        '<h3 class="ui-card-title">' + esc(p.name || p.title) + '</h3>' +
        (p.authors ? '<p class="ui-card-desc pub-authors">' + authors + '</p>' : '') +
        '<div class="ui-card-meta">' +
          (p.journal ? '<span><i class="fas fa-book"></i>' + esc(titleCase(p.journal)) + '</span>' : '') +
          (p.year ? '<span><i class="far fa-calendar"></i>' + esc(p.year) + '</span>' : '') +
        '</div></a>';
    }).join('');

    document.getElementById('pub-count').textContent = items.length + ' ' + (items.length === 1 ? T('publication', 'pubblicazione') : T('publications', 'pubblicazioni'));
    document.getElementById('pub-empty').hidden = items.length > 0;
  }

  document.getElementById('pub-types').addEventListener('click', function (e) {
    var b = e.target.closest('.ui-chip');
    if (!b) return;
    [].forEach.call(this.children, function (c) { c.classList.toggle('is-active', c === b); });
    state.type = b.dataset.type;
    render();
  });
  document.getElementById('pub-year').addEventListener('change', function () { state.year = this.value; render(); });
  document.getElementById('pub-q').addEventListener('input', function () { state.q = this.value.trim(); render(); });
  document.getElementById('pub-reset').addEventListener('click', function () {
    state = { q: '', type: '', year: '' };
    document.getElementById('pub-q').value = '';
    document.getElementById('pub-year').value = '';
    [].forEach.call(document.getElementById('pub-types').children, function (c, i) { c.classList.toggle('is-active', i === 0); });
    render();
  });
})();
</script>

<style>
.pub-filters { display: flex; gap: .75rem; margin-bottom: 1rem; }
.pub-search { flex: 1; }
.pub-year { width: 170px; flex: none; }
.pub-types { margin-bottom: 1.5rem; }
.pub-count { font-size: .9rem; font-weight: 600; color: var(--ui-muted); margin-bottom: 1rem; }
.pub-card .ui-card-title { padding-right: 1.5rem; margin-top: .3rem; }
.pub-authors { font-size: .88rem; }
.pub-authors strong { color: var(--ui-text); }
.pub-more { white-space: nowrap; font-weight: 600; color: var(--ui-accent); }
.pub-empty { text-align: center; padding: 3rem 1rem; color: var(--ui-muted); }
.pub-empty i { font-size: 2rem; color: var(--ui-faint); margin-bottom: .75rem; }
@media (max-width: 640px) {
  .pub-filters { flex-direction: column; }
  .pub-year { width: 100%; }
}
</style>

<div class="ui-social">
  {%- for account in site.author -%}
    {%- assign service_name = account[0] -%}
    {%- assign service_data = site.data.social-media[service_name] -%}
    {%- if service_data -%}
    <a href="{{ service_data.url }}{{ account[1] }}" aria-label="{{ service_name | capitalize }}" target="_blank" rel="noopener">
      <i class="{{ service_data.icon }}"></i>
    </a>
    {%- endif -%}
  {%- endfor -%}
</div>
